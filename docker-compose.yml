services:
  mariadb:
    image: mariadb:11.4
    container_name: school-cms-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: school_cms
      MARIADB_USER: school
      MARIADB_PASSWORD: schoolpass
    ports:
      - "3307:3306"
    volumes:
      - school_cms_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  school_cms_data:
